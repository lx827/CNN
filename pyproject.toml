[build-system]
requires = [
    "scikit-build-core==1.1.2",
    "pybind11==3.1.0",
    "cmake==4.4.4",
    "ninja==1.13.2",
    "pybind11-stubgen==3.0.0",
    "numpy>=1.26.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "cnn-compute"
version = "0.1.0"
description = "风机齿轮箱诊断的原生数值计算库"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26.4",
]

[dependency-groups]
cloud = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==42.0.7",
    "scipy>=1.13.1",
    "PyWavelets>=1.6.0",
    "requests==2.32.3",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
    "msgpack>=1.0.8",
    "python-jose[cryptography]>=3.3.0",
]
dc24 = ["requests==2.32.3", "python-dotenv==1.0.1"]
dev = [
    "clang-format==23.1.5",
    "httpx>=0.27",
    "pybind11-stubgen==3.0.0",
    "ruff>=0.17.4",
]
benchmark = ["emd-signal==1.9.0", "psutil==7.2.2"]
emd-reference = [
    "emd==0.8.1",
]

[tool.uv]
default-groups = ["cloud", "dc24", "dev"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "lib/**" },
    { file = "bind/**" },
    { file = "cmake/**" },
    { file = "capi/**" },
    { file = "cnn_compute/**/*.py" },
    { file = "cnn_compute/py.typed" },
    { env = "CNN_COMPUTE_ARCH" },
    { env = "CMAKE_ARGS" },
    { env = "CMAKE_GENERATOR" },
    { env = "CC" },
    { env = "CXX" },
    { env = "CXXFLAGS" },
    { env = "LDFLAGS" },
]

[tool.scikit-build]
minimum-version = "1.1"
cmake.version = ">=3.28"
cmake.args = ["-GNinja"]
build-dir = "build/{wheel_tag}/ninja"
build.tool-args = ["-j1"]
wheel.packages = ["cnn_compute"]
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]
sdist.include = ["CMakeLists.txt", "cmake/**", "capi/**", "lib/**", "bind/**", "cnn_compute/**", "examples/native-consumer/**"]
sdist.exclude = ["data/**", "build/**", "dist/**", ".venv/**", "cnn_compute/_native/**"]
