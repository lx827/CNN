[build-system]
requires = [
    "scikit-build-core==1.1.2",
    "pybind11==3.1.0",
    "cmake==4.4.4",
    "ninja==1.13.2",
    "pybind11-stubgen==3.0.0",
    "numpy>=1.26.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "cnn-compute"
version = "0.1.0"
description = "风机齿轮箱诊断的原生数值计算库"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26.4",
]

[dependency-groups]
cloud = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==42.0.7",
    "scipy>=1.13.1",
    "PyWavelets>=1.6.0",
    "requests==2.32.3",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
    "msgpack>=1.0.8",
    "python-jose[cryptography]>=3.3.0",
]
dc24 = [
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "dc24-driver==0.1.0",
]
local = [
    { include-group = "cloud" },
    { include-group = "dc24" },
]
dc24-python = ["dc24-driver-python==0.1.0"]
dc24-rust = ["dc24-driver-rust==0.1.0"]
dc24-vendor = ["dc24-driver-vendor==0.1.0"]
dev = [
    "clang-format==23.1.5",
    "httpx>=0.27",
    "pybind11-stubgen==3.0.0",
    "ruff>=0.17.4",
]
benchmark = ["emd-signal==1.9.0", "psutil==7.2.2"]
emd-reference = [
    "emd==0.8.1",
]

[tool.uv]
default-groups = ["cloud", "dc24", "dc24-python", "dev"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "compute/CMakeLists.txt" },
    { file = "compute/lib/**" },
    { file = "compute/bind/**" },
    { file = "compute/cmake/**" },
    { file = "compute/capi/**" },
    { file = "compute/cnn_compute/**/*.py" },
    { file = "compute/cnn_compute/py.typed" },
    { env = "CNN_COMPUTE_ARCH" },
    { env = "CMAKE_ARGS" },
    { env = "CMAKE_GENERATOR" },
    { env = "CC" },
    { env = "CXX" },
    { env = "CXXFLAGS" },
    { env = "LDFLAGS" },
]

[tool.uv.sources]
dc24-driver = { path = "collector/drivers/dc24", editable = true }
dc24-driver-python = { path = "collector/drivers/dc24-python", editable = true }
dc24-driver-rust = { path = "collector/drivers/dc24-rust" }
dc24-driver-vendor = { path = "collector/drivers/dc24-vendor", editable = true }

[tool.scikit-build]
minimum-version = "1.1"
cmake.version = ">=3.28"
cmake.args = ["-GNinja"]
cmake.source-dir = "compute"
build-dir = "build/{wheel_tag}/ninja"
build.tool-args = ["-j1"]
wheel.packages = ["compute/cnn_compute"]
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]
sdist.include = ["compute/CMakeLists.txt", "compute/cmake/**", "compute/capi/**", "compute/lib/**", "compute/bind/**", "compute/cnn_compute/**", "compute/examples/native-consumer/**"]
sdist.exclude = ["data/**", "build/**", "dist/**", ".venv/**", "compute/cnn_compute/_native/**"]
