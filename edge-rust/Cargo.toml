[package]
name = "dc24-edge"
version = "0.1.0"
edition = "2021"
description = "DC24 acquisition and CNN cloud uploader"
license = "MIT"

[dependencies]
anyhow = "1"
ctrlc = "3"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
