[project]
name = "cnn-cloud"
version = "0.1.0"
description = "CNN 云端 FastAPI 后端(风机齿轮箱智能故障诊断系统)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==42.0.7",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "PyWavelets>=1.6.0",
    "requests==2.32.3",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
    "msgpack>=1.0.8",
    "python-jose[cryptography]>=3.3.0",
]

# 应用目录而非可分发的库:workspace 只管理其依赖,不做包构建安装
[tool.uv]
package = false
